name: Viral tweets

on:
  schedule:
    - cron: "0 15,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viral
  cancel-in-progress: false

jobs:
  viral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python viral.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_VIRAL: ${{ secrets.DISCORD_WEBHOOK_VIRAL }}
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
      - name: Save viral state
        if: always()
        run: |
          git config user.name "watcher-bot"
          git config user.email "bot@users.noreply.github.com"
          git add viral_state.json
          git diff --cached --quiet || (git commit -m "update viral state" && git pull --rebase -X ours && git push)
